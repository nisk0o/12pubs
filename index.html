<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3326">
<title>12 Pubs of Madrid · Viniciers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
:root{--pine:#0b3326;--pine2:#124a38;--red:#b3202a;--red2:#8f1620;--gold:#e0b44c;--gold2:#a8791f;--cream:#fff7e3;--ink:#2a1a12;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--cream);font:17px/1.55 Lora,Georgia,"Times New Roman",serif;background:radial-gradient(ellipse at 50% -10%,#1b6b4e 0,var(--pine) 55%,#06201a 100%) fixed}
.display{font-family:"Mountains of Christmas","Brush Script MT","Segoe Script",cursive;font-weight:700}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lights{position:relative;display:flex;justify-content:space-between;padding:6px 10px 0;height:46px;overflow:hidden;z-index:1}
.lights::before{content:"";position:absolute;left:-6%;right:-6%;top:-26px;height:46px;border-bottom:2px solid #050f0b;border-radius:50%}
.lights i{position:relative;width:12px;height:18px;border-radius:50% 50% 45% 45%;margin-top:12px;background:var(--c);box-shadow:0 0 12px 3px var(--c);animation:tw 2.4s ease-in-out infinite}
.lights i:nth-child(even){margin-top:20px}
.lights i:nth-child(4n+1){--c:#ff4b4b}.lights i:nth-child(4n+2){--c:#ffd24d;animation-delay:.6s}.lights i:nth-child(4n+3){--c:#4dff9a;animation-delay:1.2s}.lights i:nth-child(4n+4){--c:#5ab7ff;animation-delay:1.8s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:6px 16px 40px}
header{text-align:center;margin:8px 0 18px}
h1{margin:0;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.05;background:linear-gradient(180deg,#ffe9a8,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 1px rgba(0,0,0,.2);filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.sub{margin:6px 0 0;color:#cfe5d6;font-style:italic}
.ribbon{display:inline-block;margin-top:10px;padding:4px 18px;background:var(--red);border:2px solid var(--gold);border-radius:4px;color:var(--cream);font-weight:600;letter-spacing:.02em;box-shadow:var(--shadow)}
nav{display:flex;gap:8px;margin:0 0 18px}
nav button{flex:1;padding:11px 6px;border:2px solid var(--gold2);background:var(--pine2);color:var(--cream);border-radius:12px;font:600 .98rem Lora,Georgia,serif;cursor:pointer;box-shadow:var(--shadow)}
nav button.on{background:var(--red);border-color:var(--gold);color:#fff}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.prog{height:16px;border-radius:10px;border:2px solid var(--gold);background:#06201a;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#fff 0 10px,var(--red) 10px 20px);transition:width .5s}
.count{margin:0 0 14px;text-align:right;color:#cfe5d6;font-size:.9rem}
.bar{position:relative;background:var(--cream);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:14px 14px 14px 64px;margin-bottom:14px;box-shadow:var(--shadow)}
.bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,var(--red) 0 12px,#fff 12px 24px);border-radius:12px 0 0 12px}
.bar.ok{background:#e4f2e0}
.orb{position:absolute;left:20px;top:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ff6b6b,var(--red2));border:2px solid var(--gold);color:#fff;font-weight:600;font-size:.95rem}
.bar.ok .orb{background:radial-gradient(circle at 35% 30%,#58c47f,#1d6b3d)}
.bar h3{margin:0;font-size:1.12rem;line-height:1.25}
.zone{margin:2px 0 8px;color:#6b5b4d;font-size:.9rem}
.rule{margin:6px 0 10px;padding:8px 12px;border-radius:8px;background:var(--pine);color:var(--cream);font-size:.93rem}
.rule.lock{background:#e9dcc0;color:#6b5b4d;font-style:italic}
.btn{padding:10px 16px;border:2px solid var(--gold);border-radius:10px;background:var(--red);color:#fff;font:600 .95rem Lora,Georgia,serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--gold2)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.bar .btn.on{background:#1d6b3d}
.panel{background:rgba(6,32,26,.75);border:2px solid var(--gold2);border-radius:14px;padding:14px;margin-bottom:14px}
details.panel summary{cursor:pointer;font-weight:600;color:var(--gold)}
details.panel ul{margin:10px 0 0;padding-left:20px}
.mapframe{background:var(--cream);padding:12px;border:3px solid var(--gold);border-radius:6px;box-shadow:var(--shadow);transform:rotate(-.6deg)}
.mapframe img{display:block;width:100%;height:auto;border-radius:3px}
.mapframe .ph{min-height:260px;display:grid;place-items:center;text-align:center;padding:20px;color:#6b5b4d;border:2px dashed #b9a885;border-radius:4px;background:repeating-linear-gradient(45deg,#f8efd6 0 12px,#f3e8c8 12px 24px)}
.note{color:#cfe5d6;font-size:.88rem}
label{display:block;margin:10px 0 4px;font-weight:600}
select,input{width:100%;padding:11px;border-radius:10px;border:2px solid var(--gold2);background:var(--cream);color:var(--ink);font:inherit}
.err{color:#ffb4a8;min-height:1.4em;margin:8px 0 0}
.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.flip{perspective:1000px;margin-bottom:18px;cursor:pointer}
.in{position:relative;min-height:230px;transition:transform .7s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:3px solid var(--gold);padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow)}
.front{background:repeating-linear-gradient(135deg,var(--red) 0 14px,var(--red2) 14px 28px);color:#fff}
.front b{font-size:2.2rem;display:block}
.back{transform:rotateY(180deg);background:var(--cream);color:var(--ink);overflow:hidden}
.back h3{margin:4px 0;font-size:1.5rem;color:var(--red2)}
.back p{margin:4px 0 10px}
.kind{font-size:.8rem;color:var(--gold2);font-weight:600}
.stamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid var(--red);color:var(--red);padding:2px 14px;font:700 2rem "Mountains of Christmas",cursive;opacity:.85;pointer-events:none;background:rgba(255,247,227,.8)}
footer{text-align:center;color:#9fc4ad;font-size:.85rem;margin-top:26px}
@media (prefers-reduced-motion:reduce){.lights i{animation:none}.in{transition:none}.prog i{transition:none}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="lights" id="lights" aria-hidden="true"></div>
<main>
<header>
<h1 class="display">12 Pubs of Madrid</h1>
<p class="sub">El reto navideño de los Viniciers</p>
<span class="ribbon">Sábado 19 de diciembre de 2026</span>
</header>
<nav id="nav" aria-label="Secciones"></nav>
<section id="v"></section>
<footer>🎄 Viniciers · 12 Pubs of Madrid · Navidad 2026 🎄</footer>
</main>
<script>
/* ===== DATOS (cambia aquí lo definitivo) ===== */
const REVEAL_RULES=true; // true: la regla del bar se descubre al pulsar “Hemos llegado”
const SEED=2026;         // cambia este número para repartir las cartas de otra forma
const MAP_IMAGE="ruta.png"; // sube a la misma carpeta la imagen del mapa con este nombre
const USERS=[{n:"Julián",c:"1997"},{n:"Luciano",c:"1997"},{n:"Javi",c:"1997"},{n:"Xavi",c:"1999"},{n:"Aitor",c:"1995"}];
const BARES=[
{n:"Casa Amadeo “Los Caracoles”",z:"La Latina",r:"Sin pronombres: nadie dice “yo”, “tú” ni “nosotros”."},
{n:"Taberna Tempranillo",z:"La Latina · Cava Baja",r:"Voz de susurro: todos hablan como en una biblioteca."},
{n:"Newbridge Irish Pub",z:"La Latina · Palacio",r:"Todo se pide con acento irlandés. Quien falle, paga las tapas."},
{n:"Dubliners",z:"Sol",r:"Sin dedo índice: prohibido señalar con la mano."},
{n:"Museo Chicote",z:"Gran Vía",r:"Sin nombres propios: solo apodos o descripciones."},
{n:"Taberna Ángel Sierra",z:"Chueca",r:"Sin “sí” ni “no”: hay que contestar con otras palabras."},
{n:"El Tigre",z:"Chueca",r:"Solo gestos: cada uno pide su bebida sin hablar."},
{n:"Bar Cock",z:"Chueca",r:"Brindis con una persona distinta antes de cada trago."},
{n:"Macera Taller Bar",z:"Chueca · Malasaña",r:"Sin tocarse la cara: quien lo haga, mini reto del capitán."},
{n:"Triskel Tavern",z:"Malasaña",r:"Cada uno habla con un acento extranjero asignado."},
{n:"Tupperware",z:"Malasaña",r:"Rima obligatoria: todo lo que se diga tiene que rimar."},
{n:"La Vía Láctea",z:"Malasaña",r:"Palabras prohibidas: “bar” y “cerveza”."}
];
const GEN=["📸 Sello del bar: foto de grupo en cada parada.","🥂 Brindis con una palabra navideña distinta cada vez.","💧 Agua entre bares: quien acabe antes, pide una jarra para todos.","🎁 Pedido sorpresa: una vez por bar, alguien pide por otro.","⭐ Nota del bar: del 1 al 10 en categorías absurdas."];
const COM=[
{t:"Salta una regla",d:"Te saltas la regla del bar donde la canjees."},
{t:"Eres el capitán",d:"Mandas en un bar: decides cuándo salimos."},
{t:"Pasa tu ronda",d:"Pasas tu consumición a otra persona."},
{t:"Cambia la regla",d:"Eliges la regla de otro bar para este."},
{t:"Salvavidas",d:"Anulas un castigo que te pongan."},
{t:"Veto",d:"Impides que alguien use su comodín en un bar."},
{t:"Doble o nada",d:"Si cumples la regla de un bar entero, ganas un punto extra."},
{t:"Brindis maestro",d:"Inventas el brindis y todos lo repiten."}
];
const MIS=[
"Consigue un posavasos del bar sin pedirlo directamente.",
"Haz que alguien del grupo cante un trozo de villancico.",
"Sácate una foto con el camarero o con un desconocido.",
"Consigue que dos personas distintas digan “Feliz Navidad” sin pedírselo.",
"Introduce una palabra inventada y que la repitan tres personas.",
"Haz que alguien te cuente su mejor anécdota navideña.",
"Logra una foto de grupo con una pose ridícula idea tuya.",
"Reparte un cumplido sincero a tres personas distintas."
];
/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const rng=a=>()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const shuf=(n,r)=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PM=shuf(MIS.length,rng(SEED)),PC=shuf(COM.length,rng(SEED+1));
/* ===== estado ===== */
let tab="bares",flipped={},visit=ld("vini-visit",[]),sess=ld("vini-sess",null);
const usedKey=u=>"vini-used-"+u;
/* ===== vistas ===== */
function nav(){
  const t=[["bares","🍺 Bares"],["ruta","🗺️ Ruta"],["cartas","🃏 Cartas"]];
  $("#nav").innerHTML=t.map(x=>`<button class="${tab===x[0]?"on":""}" data-t="${x[0]}">${x[1]}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
}
function bares(){
  const n=BARES.filter((_,i)=>visit[i]).length;
  let h=`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${BARES.length}" aria-valuenow="${n}"><i style="width:${n/BARES.length*100}%"></i></div><p class="count">${n} de ${BARES.length} pubs visitados</p>`;
  h+=`<details class="panel"><summary>Reglas generales del día</summary><ul>${GEN.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></details>`;
  h+=BARES.map((b,i)=>{
    const ok=!!visit[i],show=ok||!REVEAL_RULES;
    return `<article class="bar ${ok?"ok":""}"><div class="orb">${ok?"✓":i+1}</div><h3>${esc(b.n)}</h3><p class="zone">${esc(b.z)}</p>${show?`<div class="rule"><b>Regla de este bar:</b> ${esc(b.r)}</div>`:`<div class="rule lock">🔒 La regla se desvela cuando lleguéis.</div>`}<button class="btn ${ok?"on":""}" data-i="${i}">${ok?"✓ Visitado (deshacer)":"Hemos llegado"}</button></article>`}).join("");
  $("#v").innerHTML=h;
  $("#v").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;visit[i]=!visit[i];sv("vini-visit",visit);draw()});
}
function ruta(){
  $("#v").innerHTML=`<div class="mapframe"><img id="mi" alt="Mapa de la ruta con los 12 pubs" src="${esc(MAP_IMAGE)}"><div class="ph" id="ph" hidden><div><b class="display" style="font-size:1.6rem">Aquí irá el mapa</b><br>Sube la imagen como <code>${esc(MAP_IMAGE)}</code> a la misma carpeta que este archivo.</div></div></div><p class="note">Es solo una imagen, sin GPS y sin “estás aquí”. Tocará orientarse.</p>`;
  const im=$("#mi");im.onerror=()=>{im.hidden=true;$("#ph").hidden=false};
}
function cartas(){
  if(!sess){
    $("#v").innerHTML=`<div class="panel"><h2 class="display" style="margin:0 0 4px;font-size:1.8rem;color:var(--gold)">Entra con tu código</h2><p class="note">Tus cartas son secretas: solo se ven con tu nombre y tu código.</p><label for="u">Nombre</label><select id="u">${USERS.map(u=>`<option>${esc(u.n)}</option>`).join("")}</select><label for="c">Código</label><input id="c" type="password" inputmode="numeric" autocomplete="off"><p class="err" id="e" role="alert"></p><button class="btn" id="go">Abrir mis cartas</button></div>`;
    $("#go").onclick=()=>{const u=USERS.find(x=>x.n===$("#u").value);if(u&&u.c===$("#c").value.trim()){sess=u.n;sv("vini-sess",sess);flipped={};draw()}else $("#e").textContent="Código incorrecto. Prueba otra vez."};
    return;
  }
  const idx=USERS.findIndex(u=>u.n===sess);
  if(idx<0){sess=null;sv("vini-sess",null);return cartas()}
  const us=ld(usedKey(sess),{c:false,m:false});
  const cards=[{k:"c",kind:"Carta comodín",icon:"🎟️",t:COM[PC[idx]].t,d:COM[PC[idx]].d},{k:"m",kind:"Misión secreta",icon:"🕵️",t:"Tu misión",d:MIS[PM[idx]]}];
  let h=`<div class="who"><span>🎅 Hola, <b>${esc(sess)}</b></span><button class="btn ghost sm" id="out">Salir</button></div><p class="note">Toca una carta para darle la vuelta. Que no te vea nadie.</p>`;
  h+=cards.map(c=>`<div class="flip ${flipped[c.k]?"f":""}" data-k="${c.k}"><div class="in"><div class="face front"><b>${c.icon}</b>${c.kind}<br><small>Toca para descubrir</small></div><div class="face back"><span class="kind">${c.kind}</span><h3 class="display">${esc(c.t)}</h3><p>${esc(c.d)}</p>${us[c.k]?`<div class="stamp">CANJEADA</div>`:`<button class="btn sm" data-r="${c.k}">Canjear</button>`}</div></div></div>`).join("");
  $("#v").innerHTML=h;
  $("#out").onclick=()=>{sess=null;sv("vini-sess",null);flipped={};draw()};
  $("#v").querySelectorAll(".flip").forEach(f=>f.onclick=()=>{flipped[f.dataset.k]=!flipped[f.dataset.k];f.classList.toggle("f")});
  $("#v").querySelectorAll("[data-r]").forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm("¿Canjear esta carta? No se puede deshacer.")){us[b.dataset.r]=true;sv(usedKey(sess),us);draw()}});
}
function draw(){nav();({bares,ruta,cartas})[tab]();window.scrollTo({top:0})}
/* ===== decoración ===== */
$("#lights").innerHTML="<i></i>".repeat(Math.max(10,Math.floor(innerWidth/38)));
(function snow(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=$("#snow"),x=c.getContext("2d");let W,H;
  const f=Array.from({length:55},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*2.6,s:.25+Math.random()*.7,d:Math.random()*6}));
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
  (function t(){x.clearRect(0,0,W,H);x.fillStyle="rgba(255,255,255,.85)";
    for(const p of f){p.y+=p.s/H*2.2;p.d+=.01;if(p.y>1){p.y=-.02;p.x=Math.random()}
      x.beginPath();x.arc((p.x+Math.sin(p.d)*.02)*W,p.y*H,p.r,0,6.3);x.fill()}
    requestAnimationFrame(t)})();
})();
draw();
</script>
</body>
</html>
